[build]
command = "npx prisma generate && (npx prisma db push --skip-generate --accept-data-loss || true) && npm run build"
# Override Netlify UI if publish was set to repo root (breaks @netlify/plugin-nextjs).
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
